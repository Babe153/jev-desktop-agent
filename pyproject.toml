[project]
name = "jev-desktop-agent"
version = "0.1.0"
description = "Windows voice tools selected by TypeSafe Jev"
requires-python = ">=3.11,<3.14"
dependencies = [
  "python-dotenv>=1.0,<2",
  "playwright>=1.50,<2",
  "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
  "opencv-python>=4.10,<5",
  "sounddevice>=0.5,<0.6",
  "numpy>=2,<3",
  "faster-whisper>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
